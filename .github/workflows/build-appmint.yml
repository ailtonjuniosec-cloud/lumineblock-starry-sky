name: Build LumineBlock for AppMint

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restaurar cache das dependências
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependências
        run: bun install --frozen-lockfile --verbose

      - name: Compilar LumineBlock
        run: bun run build

      - name: Diagnosticar HTML
        run: |
          echo "=== HTML GERADO ==="
          sed -n '1,200p' .output/public/_shell.html
          echo "=== REFERÊNCIAS ==="
          grep -oE '(src|href)="[^"]+"' .output/public/_shell.html || true

      - name: Preparar ZIP AppMint
        run: node scripts/package-appmint.mjs

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LumineBlock-AppMint-Offline
          path: release/LumineBlock-AppMint-Offline.zip
          if-no-files-found: error
          retention-days: 14
          
