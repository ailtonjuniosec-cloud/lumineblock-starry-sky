name: Build LumineBlock for AppMint

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restaurar cache das dependências
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependências
        run: bun install --frozen-lockfile --verbose

      - name: Compilar LumineBlock
        run: bun run build

      - name: Diagnosticar arquivos gerados
        run: |
          echo "=== DIST COMPLETO ==="
          find dist -maxdepth 5 -type f
          echo "=== OUTPUT PUBLIC COMPLETO ==="
          find .output/public -maxdepth 5 -type f
          echo "=== SHELL HTML ==="
          find . -name "_shell.html" -not -path "*/node_modules/*"

      - name: Preparar ZIP AppMint
        run: node scripts/package-appmint.mjs

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LumineBlock-AppMint-Offline
          path: release/LumineBlock-AppMint-Offline.zip
          if-no-files-found: error
          retention-days: 14
